name: Brain engine (CI)
description: >
  Starts the Brain engine inside the job on an ephemeral Postgres (pgvector), seeds one channel with a
  heuristic Brain, and exports BRAIN_ENGINE_URL / BRAIN_WORKSPACE_ID / BRAIN_CHANNEL_ID_<CHANNEL>
  for the steps that follow. No server to host; everything is discarded when the job ends.
inputs:
  channel:
    description: Channel name to register (lowercase letters, digits, underscore), e.g. english
    required: false
    default: english
runs:
  using: composite
  steps:
    - name: Start ephemeral Postgres (pgvector)
      shell: bash
      run: |
        docker run -d --name brain-db \
          -e POSTGRES_USER=brain -e POSTGRES_PASSWORD=brain -e POSTGRES_DB=brain \
          -p 127.0.0.1:5432:5432 pgvector/pgvector:pg16
    - name: Migrate, seed and start the engine
      shell: bash
      env:
        DATABASE_URL: postgresql://brain:brain@127.0.0.1:5432/brain
        CHANNEL: ${{ inputs.channel }}
      run: ${{ github.action_path }}/../../../scripts/ci_engine.sh
