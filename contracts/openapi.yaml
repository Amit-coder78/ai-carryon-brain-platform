openapi: 3.1.0
info:
  title: AI CarryON Brain Platform API
  version: 0.1.0
  description: Phase 2 implements health/ready, workspaces, channels, brains, versions, attachments, channel brain list and audit. Everything else is still proposed. Registry routes require header x-workspace-id (uuid); x-actor is recorded in the audit log. This header identity is a placeholder for real authentication.
servers: [{url: http://localhost:3000}]
components:
  parameters:
    IdempotencyKey: {name: Idempotency-Key, in: header, required: false, schema: {type: string}}
  schemas:
    Error:
      type: object
      required: [code, message]
      properties: {code: {type: string}, message: {type: string}, correlation_id: {type: string}}
    Job:
      type: object
      required: [job_id, status]
      properties:
        job_id: {type: string, format: uuid}
        status: {enum: [queued, running, succeeded, failed, dead]}
    Brain:
      type: object
      required: [brain_id, workspace_id, name, brain_type, status]
      properties:
        brain_id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        name: {type: string}
        brain_type: {type: string}
        status: {enum: [draft, active, disabled, archived, deleted]}
    Attachment:
      type: object
      required: [attachment_id, brain_id, channel_id, role, status]
      properties:
        attachment_id: {type: string, format: uuid}
        brain_id: {type: string, format: uuid}
        channel_id: {type: string, format: uuid}
        role: {enum: [primary, supporting, experimental, shadow]}
        status: {enum: [pending, active, disabled, detached]}
paths:
  /v1/health: {get: {summary: Liveness, responses: {"200": {description: ok}}}}
  /v1/ready: {get: {summary: Readiness, responses: {"200": {description: ready}, "503": {description: not ready}}}}
  /v1/workspaces: {post: {summary: Create workspace (Phase 2 helper), responses: {"201": {description: created}}}}
  /v1/channels: {post: {summary: Create channel in the x-workspace-id workspace (Phase 2 helper), responses: {"201": {description: created}, "409": {description: name exists}}}}
  /v1/audit: {get: {summary: Latest 200 audit events for the workspace, responses: {"200": {description: ok}}}}
  /v1/brains:
    get: {summary: List brains, responses: {"200": {description: ok}}}
    post:
      summary: Create brain
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      responses: {"201": {description: created}}
  /v1/brains/{brain_id}: {get: {summary: Get brain, parameters: [{name: brain_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"200": {description: ok}}}}
  /v1/brains/{brain_id}/versions: {post: {summary: Create next immutable version, parameters: [{name: brain_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"201": {description: created}}}, get: {summary: List versions, parameters: [{name: brain_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"200": {description: ok}}}}
  /v1/brains/{brain_id}/clone: {post: {summary: Clone brain, parameters: [{name: brain_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"202": {description: job accepted}}}}
  /v1/brains/{brain_id}/export: {post: {summary: Export package, parameters: [{name: brain_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"202": {description: job accepted}}}}
  /v1/brains/import: {post: {summary: Import package (inactive until activated), responses: {"202": {description: job accepted}}}}
  /v1/attachments: {post: {summary: Attach brain to channel, parameters: [{$ref: "#/components/parameters/IdempotencyKey"}], responses: {"201": {description: created}}}}
  /v1/attachments/{attachment_id}/detach: {post: {summary: Detach, parameters: [{name: attachment_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"200": {description: ok}}}}
  /v1/attachments/{attachment_id}/replace: {post: {summary: Replace version, parameters: [{name: attachment_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"200": {description: ok}}}}
  /v1/attachments/{attachment_id}/disable: {post: {summary: Disable, parameters: [{name: attachment_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"200": {description: ok}}}}
  /v1/channels/{channel_id}/brains: {get: {summary: Brains on a channel, parameters: [{name: channel_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"200": {description: ok}}}}
  /v1/channels/{channel_id}/brain/search: {post: {summary: Search brain knowledge (authorize first), parameters: [{name: channel_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"200": {description: ok}}}}
  /v1/ideas/rank: {post: {summary: Rank candidate topics, responses: {"200": {description: ranked result with brain versions used and fallback source}}}}
  /v1/runtime/execute: {post: {summary: "Run attached Brains on candidates (served by the engine, port 8001). Needs x-workspace-id. Returns fused ranking, source brains|partial|baseline_fallback, and each Brain's standard response. Brain types: heuristic, demand (Phase 6). Candidate features accept optional recent_requesters (recency-weighted distinct requesters; null = unknown) and history_videos.", responses: {"200": {description: ok}, "400": {description: bad identity}, "422": {description: invalid candidates}, "503": {description: database unavailable}}}}
  /v1/decisions: {get: {summary: List decisions, responses: {"200": {description: ok}}}}
  /v1/decisions/{decision_id}/selection: {post: {summary: "Pipeline reports which candidate it used ({candidate_id}); settable once", parameters: [{name: decision_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"200": {description: ok}, "409": {description: different candidate already recorded}}}}
  /v1/decisions/{decision_id}: {get: {summary: Get decision, parameters: [{name: decision_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"200": {description: ok}}}}
  /v1/observations: {post: {summary: "Record an outcome metric ({channel_id, video_ref, metric, value, decision_id?})", parameters: [{$ref: "#/components/parameters/IdempotencyKey"}], responses: {"202": {description: accepted}}}}
  /v1/comment-signals: {post: {summary: "Ingest demand signals: {channel_id, signals:[{commenter_id, topic, kind?, observed_at?}]} (max 500). Stores a salted hash of the commenter and the normalized topic only, never comment text. Returns {accepted, rejected}.", parameters: [{$ref: "#/components/parameters/IdempotencyKey"}], responses: {"202": {description: accepted}, "404": {description: channel not in workspace}}}}
  /v1/experiments: {post: {summary: Create experiment, responses: {"201": {description: created}}}}
  /v1/experiments/{experiment_id}: {get: {summary: Get experiment, parameters: [{name: experiment_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"200": {description: ok}}}}
  /v1/models/{model_version_id}/promote: {post: {summary: Promote model, parameters: [{name: model_version_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"200": {description: ok}}}}
  /v1/models/{model_version_id}/rollback: {post: {summary: Rollback model, parameters: [{name: model_version_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"200": {description: ok}}}}
  /v1/jobs/{job_id}: {get: {summary: Job status, parameters: [{name: job_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"200": {description: ok}}}}
