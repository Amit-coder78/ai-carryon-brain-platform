openapi: 3.1.0
info:
  title: AI CarryON Brain Platform API
  version: 0.1.0
  description: Phase 2 implements health/ready, workspaces, channels, brains, versions, attachments, channel brain list and audit; Phase 7 adds clone, export, import, dependencies, activate, archive, unarchive and delete for Brains. Everything else is still proposed. Registry routes require header x-workspace-id (uuid); x-actor is recorded in the audit log. This header identity is a placeholder for real authentication.
servers: [{url: http://localhost:3000}]
components:
  parameters:
    IdempotencyKey: {name: Idempotency-Key, in: header, required: false, schema: {type: string}}
  schemas:
    Error:
      type: object
      required: [code, message]
      properties: {code: {type: string}, message: {type: string}, correlation_id: {type: string}}
    Job:
      type: object
      required: [job_id, status]
      properties:
        job_id: {type: string, format: uuid}
        status: {enum: [queued, running, succeeded, failed, dead]}
    Brain:
      type: object
      required: [brain_id, workspace_id, name, brain_type, status]
      properties:
        brain_id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        name: {type: string}
        brain_type: {type: string}
        status: {enum: [draft, active, disabled, archived, deleted]}
    Attachment:
      type: object
      required: [attachment_id, brain_id, channel_id, role, status]
      properties:
        attachment_id: {type: string, format: uuid}
        brain_id: {type: string, format: uuid}
        channel_id: {type: string, format: uuid}
        role: {enum: [primary, supporting, experimental, shadow]}
        status: {enum: [pending, active, disabled, detached]}
paths:
  /v1/health: {get: {summary: Liveness, responses: {"200": {description: ok}}}}
  /v1/ready: {get: {summary: Readiness, responses: {"200": {description: ready}, "503": {description: not ready}}}}
  /v1/workspaces: {post: {summary: Create workspace (Phase 2 helper), responses: {"201": {description: created}}}}
  /v1/channels: {post: {summary: Create channel in the x-workspace-id workspace (Phase 2 helper), responses: {"201": {description: created}, "409": {description: name exists}}}}
  /v1/audit: {get: {summary: Latest 200 audit events for the workspace, responses: {"200": {description: ok}}}}
  /v1/brains:
    get: {summary: List brains, responses: {"200": {description: ok}}}
    post:
      summary: Create brain
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      responses: {"201": {description: created}}
  /v1/brains/{brain_id}: {get: {summary: Get brain, parameters: [{name: brain_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"200": {description: ok}}}, delete: {summary: "Phase 7. Soft delete. Allowed only for draft or archived Brains with no live attachments (409 lists the blockers). Versions, audit and decision records are kept; the name becomes reusable.", parameters: [{name: brain_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"200": {description: deleted}, "409": {description: blocked}}}}
  /v1/brains/{brain_id}/versions: {post: {summary: "Create next immutable version. Body {capabilities?, artifact_refs?, checksum?, params?}. params are settings of this version (a demand Brain accepts half_life_days 1-365 and min_requesters 1-1000; other Brain types accept none); omitted means the built-in defaults. Bad params are a 400.", parameters: [{name: brain_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"201": {description: created}}}, get: {summary: List versions, parameters: [{name: brain_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"200": {description: ok}}}}
  /v1/brains/{brain_id}/clone: {post: {summary: "Clone a Brain (Phase 7, synchronous). Body {name?, versions?: latest|all|none}. New identity, created inactive (draft); versions are renumbered from 1 and evaluation starts again. Attachments, audit and decision history, and credentials are never copied.", parameters: [{name: brain_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"201": {description: created}, "409": {description: name exists}}}}
  /v1/brains/{brain_id}/export: {post: {summary: "Export a checksummed package (Phase 7, synchronous). Body {versions?: all|latest}. Returns {export_id, package} where package = {manifest, files, package_sha256}. Signed with Ed25519 when the registry has BRAIN_SIGNING_KEY (adds a `signature` block outside the sealed content). Refused (422 export_blocked, paths only) if the Brain contains something that looks like a secret.", parameters: [{name: brain_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"200": {description: ok}, "422": {description: export_blocked}}}}
  /v1/brains/import: {post: {summary: "Import a package (Phase 7, synchronous). Body {package, name?, dry_run?}. Runs structure, checksums, compatibility, secret-scan and signature checks (a wrong signature is always refused; an unsigned or untrusted-signer package is refused only when BRAIN_REQUIRE_SIGNATURE is on); dry_run reports them and creates nothing. A real import is all-or-nothing and creates an inactive (draft) Brain. 422 invalid_package carries the per-check report.", parameters: [{$ref: "#/components/parameters/IdempotencyKey"}], responses: {"201": {description: created}, "200": {description: dry run report}, "409": {description: name exists}, "422": {description: invalid_package}, "413": {description: body over 1 MB}}}}
  /v1/brains/{brain_id}/dependencies: {get: {summary: "Phase 7. Live bindings, clones, exports and decision records for a Brain, with whether archive and delete are allowed and why not.", parameters: [{name: brain_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"200": {description: ok}}}}
  /v1/signing: {get: {summary: "Phase 7 follow-up. This registry's package-signing setup: {can_sign, key_id, public_key, require_signature, trusted_key_ids}. Never returns a private key. Needs no workspace header.", responses: {"200": {description: ok}}}}
  /v1/brains/{brain_id}/versions/import: {post: {summary: "Add a package's versions to this existing Brain (Phase 7 follow-up, synchronous). Body {package, dry_run?}. Same checks as import, including signature. New versions continue the Brain's numbering and arrive unevaluated; attachments and Brain status are not changed. dry_run returns {would_add, blockers, can_import} and writes nothing. 409 (nothing written): brain_type differs, Brain archived, package has no versions, or the same package was already imported here. 404 for another workspace's Brain. 422 invalid_package carries the per-check report.", parameters: [{name: brain_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: "#/components/parameters/IdempotencyKey"}], responses: {"201": {description: versions added}, "200": {description: dry run report}, "409": {description: blocked}, "422": {description: invalid_package}, "413": {description: body over 1 MB}}}}
  /v1/brains/{brain_id}/activate: {post: {summary: "Phase 7. draft -> active (needs a version). Attaching a draft Brain does the same.", parameters: [{name: brain_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"200": {description: ok}, "409": {description: not a draft, or no versions}}}}
  /v1/brains/{brain_id}/archive: {post: {summary: "Phase 7. Takes the Brain out of normal selection; versions and records stay. Body {detach_attachments?: boolean}; without it, live attachments make this a 409 listing them.", parameters: [{name: brain_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"200": {description: ok}, "409": {description: live attachments, or already archived}}}}
  /v1/brains/{brain_id}/unarchive: {post: {summary: "Phase 7. archived -> active (or draft if it has no versions). Never re-attaches to a channel.", parameters: [{name: brain_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"200": {description: ok}, "409": {description: not archived}}}}
  /v1/attachments: {post: {summary: Attach brain to channel, parameters: [{$ref: "#/components/parameters/IdempotencyKey"}], responses: {"201": {description: created}}}}
  /v1/attachments/{attachment_id}/detach: {post: {summary: Detach, parameters: [{name: attachment_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"200": {description: ok}}}}
  /v1/attachments/{attachment_id}/replace: {post: {summary: Replace version, parameters: [{name: attachment_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"200": {description: ok}}}}
  /v1/attachments/{attachment_id}/disable: {post: {summary: Disable, parameters: [{name: attachment_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"200": {description: ok}}}}
  /v1/channels/{channel_id}/brains: {get: {summary: Brains on a channel, parameters: [{name: channel_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"200": {description: ok}}}}
  /v1/channels/{channel_id}/brain/search: {post: {summary: Search brain knowledge (authorize first), parameters: [{name: channel_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"200": {description: ok}}}}
  /v1/ideas/rank: {post: {summary: Rank candidate topics, responses: {"200": {description: ranked result with brain versions used and fallback source}}}}
  /v1/runtime/execute: {post: {summary: "Run attached Brains on candidates (served by the engine, port 8001). Needs x-workspace-id. Returns fused ranking, source brains|partial|baseline_fallback, and each Brain's standard response. Brain types: heuristic, demand (Phase 6), semantic (Phase 8: candidate features neighbor_ratio >= 0 (similarity-weighted geometric mean of past outcome / channel baseline; null = unknown), neighbor_count >= 0 and max_similarity_recent in [0,1] (null = unknown), all computed by the caller; no evidence scores a neutral 0.5 and a Brain with no evidence anywhere abstains). Candidate features accept optional recent_requesters (recency-weighted distinct requesters; null = unknown) and history_videos.", responses: {"200": {description: ok}, "400": {description: bad identity}, "422": {description: invalid candidates}, "503": {description: database unavailable}}}}
  /v1/decisions: {get: {summary: List decisions, responses: {"200": {description: ok}}}}
  /v1/decisions/{decision_id}/selection: {post: {summary: "Pipeline reports which candidate it used ({candidate_id}); settable once", parameters: [{name: decision_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"200": {description: ok}, "409": {description: different candidate already recorded}}}}
  /v1/decisions/{decision_id}: {get: {summary: Get decision, parameters: [{name: decision_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"200": {description: ok}}}}
  /v1/observations: {post: {summary: "Record an outcome metric ({channel_id, video_ref, metric, value, decision_id?})", parameters: [{$ref: "#/components/parameters/IdempotencyKey"}], responses: {"202": {description: accepted}}}}
  /v1/comment-signals: {post: {summary: "Ingest demand signals: {channel_id, signals:[{commenter_id, topic, kind?, observed_at?}]} (max 500). Stores a salted hash of the commenter and the normalized topic only, never comment text. Returns {accepted, rejected}.", parameters: [{$ref: "#/components/parameters/IdempotencyKey"}], responses: {"202": {description: accepted}, "404": {description: channel not in workspace}}}}
  /v1/experiments: {post: {summary: Create experiment, responses: {"201": {description: created}}}}
  /v1/experiments/{experiment_id}: {get: {summary: Get experiment, parameters: [{name: experiment_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"200": {description: ok}}}}
  /v1/models/{model_version_id}/promote: {post: {summary: Promote model, parameters: [{name: model_version_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"200": {description: ok}}}}
  /v1/models/{model_version_id}/rollback: {post: {summary: Rollback model, parameters: [{name: model_version_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"200": {description: ok}}}}
  /v1/jobs/{job_id}: {get: {summary: Job status, parameters: [{name: job_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {"200": {description: ok}}}}
