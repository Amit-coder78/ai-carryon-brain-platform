<header><h1>AI CarryON Channel Brain Platform</h1>
<p class="sub">How the creator dashboard, the existing ai-carryon pipeline, the Brain Runtime, independent Channel Brains, the learning engine and storage connect, and how published videos feed back into learning. A proposed design, not a description of finished software.</p></header>
<div class="tabs" id="tabs" role="tablist" aria-label="Architecture sections"></div>
<main id="m"></main>
<template id="refT">


<section id="overview">
<h2>Overview</h2>
<p>AI CarryON keeps producing and publishing videos. The Channel Brain platform adds the intelligence around it: learning from comments, analytics and past decisions, and returning recommendations the pipeline can use.</p>
<div class="g">
<div class="c"><h3>Independent Brains</h3><p>Searchable, reusable and versioned assets that attach to channels and detach again.</p></div>
<div class="c"><h3>Isolated learning</h3><p>Each channel keeps its own learning state. Sharing a model never shares private audience history.</p></div>
<div class="c"><h3>Traceable decisions</h3><p>Every recommendation records evidence, confidence, Brain version and policy version.</p></div>
<div class="c"><h3>Portable packages</h3><p>Export, import, clone and restore Brains, with a path to distributing them outside AI CarryON.</p></div>
</div>
<h3>Who does what</h3>
<div class="tbl"><table>
<tr><th>System</th><th>Responsibility</th></tr>
<tr><td>Existing AI CarryON</td><td>Produces and publishes videos (per-channel scheduled workflows)</td></tr>
<tr><td>Express.js Platform API</td><td>Workspaces, channels, permissions, Brain assets and lifecycle operations</td></tr>
<tr><td>Python Learning Engine</td><td>Inference, demand estimation, prediction, training, evaluation</td></tr>
<tr><td>Brain Registry</td><td>Brain identities, metadata, versions and lifecycle state</td></tr>
<tr><td>Decision Coordinator</td><td>Runs selected Brains and combines their outputs</td></tr>
<tr><td>Brain Runtime</td><td>Executes a selected immutable Brain version, initially inside the FastAPI service</td></tr><tr><td>PostgreSQL</td><td>Structured records and learning history</td></tr>
<tr><td>Vector search</td><td>Retrieves semantically relevant learned knowledge</td></tr>
<tr><td>Object storage</td><td>Model artifacts, snapshots, Brain exports</td></tr>
<tr><td>Background workers</td><td>Comments, analytics, training, export jobs</td></tr>
</table></div>
<p>The pipeline and the learning engine talk only through documented APIs and event contracts, never through each other's internals.</p>
</section>

<section id="layers">
<h2>Architecture layers</h2>
<div class="stack">
<div class="layer"><b>1. Dashboard</b><div>Brain search, detail pages, attachment management, version and model inspection, learning history, decision logs, import/export, execution groups, audit history. A management view, not the source of truth.</div></div>
<div class="layer"><b>2. Express.js API</b><div>Authentication, workspace and channel ownership, Registry operations, attachment lifecycle, version selection, import/export orchestration, search, validation, rate limiting, audit events.</div></div>
<div class="layer"><b>3. Registry and Coordinator</b><div>The Registry tracks identity, ownership, versions, capabilities and status. The Coordinator picks eligible Brains, invokes them, validates responses and applies the decision policy.</div></div>
<div class="layer"><b>4. Python Learning Engine</b><div>FastAPI service for comment classification, clustering, demand estimation, performance prediction, bandits, rewards, training, evaluation and knowledge retrieval.</div></div>
<div class="layer"><b>5. Persistent storage</b><div>PostgreSQL as source of truth, a vector index for semantic search, object storage for artifacts. Redis and a job queue for caching, concurrency and async work.</div></div>
</div>
<div class="note">Training, embedding generation and exports run as background jobs. They never block an HTTP request.</div>
</section>

<section id="principles">
<h2>Architectural principles</h2>
<div class="g">
<div class="c"><h3>Identity ≠ attachment</h3><p><code>brain_tech_001</code> can be detached from a channel without deleting what it learned. Detaching from one channel never affects others.</p></div>
<div class="c"><h3>Channel-level isolation</h3><p>Observations, comment signals, demand estimates, experiments and decisions belong to a workspace and channel.</p></div>
<div class="c"><h3>Versioning</h3><p>Models, strategy, policy, training snapshot, evaluation report and export manifest all carry explicit versions.</p></div>
<div class="c"><h3>Replaceable parts</h3><p>New models, search engines, storage and Brain types plug in through interfaces. No hardcoded channels.</p></div>
<div class="c"><h3>Traceable decisions</h3><p>Evidence references, confidence, Brain version, policy version and rationale are preserved.</p></div>
</div>
</section>

<section id="registry">
<h2>Brain Registry</h2>
<p>The central catalogue. Each Brain has a stable, generated <code>brain_id</code> that is independent of its display name.</p>
<pre>brain_id · owner_workspace_id · name · description · brain_type
capabilities · status · current_version_id · created_at · updated_at</pre>
<div class="tbl"><table>
<tr><th>Example Brain</th><th>Example ID</th><th>Purpose</th></tr>
<tr><td>Cricket Performance</td><td><code>brain_cricket_001</code></td><td>Predict cricket content performance</td></tr>
<tr><td>Bhakti Audience</td><td><code>brain_bhakti_001</code></td><td>Understand devotional audience interests</td></tr>
<tr><td>Tech Demand</td><td><code>brain_tech_001</code></td><td>Estimate demand for technology topics</td></tr>
<tr><td>Finance Research</td><td><code>brain_finance_001</code></td><td>Evaluate finance topic opportunities</td></tr>
<tr><td>Universal Topic Analyzer</td><td><code>brain_topic_001</code></td><td>Analyze topics using permitted shared capabilities</td></tr>
</table></div>
<p>These IDs are illustrative. The application generates real ones.</p>
<p>The Registry supports exact lookup, name and description search, filters by type, capability, owner and permission, lists of available and attached Brains, version history, lifecycle status, dependency inspection and searchable audit history.</p>
</section>

<section id="lifecycle">
<h2>Brain lifecycle</h2>
<p>Disable, detach, archive, replace, clone and delete are different operations.</p>
<div class="g">
<div class="c"><h3>Attach</h3><p>Check permissions, ownership or sharing, and compatibility. Create the binding, load and verify the version, activate only after validation, write the audit event.</p></div>
<div class="c"><h3>Detach</h3><p>Mark detaching, stop new work, finish or cancel in-flight jobs by policy, mark detached. Identity, state, artifacts and history stay. The Brain remains searchable.</p></div>
<div class="c"><h3>Disable</h3><p>Temporarily blocks execution without deleting the Brain or necessarily removing the binding. Useful for debugging and quality concerns.</p></div>
<div class="c"><h3>Replace</h3><p>Validate, pick a compatible version, optionally shadow-evaluate, switch atomically, keep old references, monitor, roll back if needed.</p></div>
<div class="c"><h3>Clone</h3><p>New identity from a snapshot. Explicitly choose what is copied. Never silently inherit credentials, private comments or unauthorized audience data.</p></div>
<div class="c"><h3>Archive</h3><p>Removes the Brain from normal selection and keeps records and artifacts under the retention policy.</p></div>
<div class="c"><h3>Delete</h3><p>Checks active bindings, dependent Brains, running jobs, export dependencies, retention and authorization. Removing a binding never deletes a shared Brain.</p></div>
</div>
</section>

<section id="binding">
<h2>Channel-to-Brain binding</h2>
<p>The relationship lives in its own <code>channel_brain_bindings</code> table, never as a permanent property of the Brain.</p>
<pre>binding_id · workspace_id · channel_id · brain_id · brain_version_id
role · status · priority · attached_at · detached_at</pre>
<p>Roles: <code>primary</code>, <code>supporting</code>, <code>experimental</code>, <code>shadow</code>. Limits on active primary Brains follow the channel policy. A Brain attaches to several channels only if its sharing permissions allow it.</p>
</section>

<section id="parallel">
<h2>Parallel Brain execution</h2>
<p>A channel can run a group, for example Performance, Audience Demand, Trend and Quality Brains, over the same candidate topics.</p>
<div class="fl"><span>Select bindings</span><i>→</i><span>Resolve versions</span><i>→</i><span>Assign execution_id</span><i>→</i><span>Run concurrently</span><i>→</i><span>Timeouts and limits</span><i>→</i><span>Validate responses</span><i>→</i><span>Normalize scores</span><i>→</i><span>Aggregate (versioned policy)</span><i>→</i><span>Rank and explain</span><i>→</i><span>Record decision</span></div>
<h3>Standard Brain response</h3>
<pre>execution_id · brain_id · brain_version_id · status · recommendations
confidence · evidence_refs · reason_codes · created_at</pre>
<div class="note">Confidence from different models is not necessarily calibrated or comparable, so the Coordinator must normalize it. Hard policy constraints stay separate from ranking scores.</div>
</section>

<section id="learning">
<h2>Learning engine</h2>
<p>Different evidence gets different learning strategies.</p>
<div class="g">
<div class="c"><h3>Comment understanding</h3><p>A language model or classifier labels comments: requests, questions, praise, criticism, corrections, spam, other. No retraining per comment.</p></div>
<div class="c"><h3>Topic clustering</h3><p>Embeddings group similar requests (for example, "build AI agents" variants) while keeping materially different topics apart.</p></div>
<div class="c"><h3>Demand estimation</h3><p>Uses request counts, distinct requesters, recency, spam filtering, audience size, relevance, history and uncertainty. One request never triggers a video by itself.</p></div>
<div class="c"><h3>Performance prediction</h3><p>A supervised model such as CatBoost, once enough representative history exists. Do not assume it transfers between channels.</p></div>
<div class="c"><h3>Contextual bandit</h3><p>Balances reusing promising strategies against testing alternatives, accounting for uncertainty and experiment cost.</p></div>
<div class="c"><h3>Reward function</h3><p>Versioned and normalized: relative views, retention, engagement, shares, subscriber conversion. Compare videos at similar ages.</p></div>
</div>
<div class="tbl"><table>
<tr><th>Component</th><th>Update strategy</th></tr>
<tr><td>Comment classification</td><td>Inference on new comments</td></tr>
<tr><td>Topic-demand estimates</td><td>Incremental updates</td></tr>
<tr><td>Topic clusters</td><td>Incremental assignment, periodic maintenance</td></tr>
<tr><td>Contextual bandit</td><td>Incremental or scheduled</td></tr>
<tr><td>Performance model</td><td>Periodic retraining</td></tr>
<tr><td>Learned strategy</td><td>Updated from accumulated evidence</td></tr>
<tr><td>Active model version</td><td>Promoted only after evaluation</td></tr>
</table></div>
<p>Every training run records its data snapshot, configuration, evaluation results and resulting model version.</p>
</section>

<section id="search">
<h2>Search</h2>
<p>Search is a core feature with two modes.</p>
<div class="g">
<div class="c"><h3>Structured</h3><p>Brain ID, name, owner workspace, channel bindings, type, capabilities, status, model version, dates.</p></div>
<div class="c"><h3>Semantic knowledge</h3><p>Natural-language questions such as "Which hooks performed well for AI agent tutorials?" return summaries, evidence references, confidence and version.</p></div>
</div>
<div class="note ok">Vector similarity is not authorization. Permissions are enforced before any result is returned, filtered by workspace and channel.</div>
<pre>POST /v1/channels/{channel_id}/brain/search
{ "query": "Which hooks worked best for AI agent tutorials?",
  "filters": { "knowledge_type": "performance_pattern" }, "limit": 10 }

{ "channel_id": "ch_tech_001", "brain_id": "brain_tech_001", "brain_version": "v12",
  "results": [{ "knowledge_id": "knowledge_104",
    "summary": "Demonstration-led hooks performed well in the evaluated sample",
    "confidence": 0.78, "evidence_count": 24 }] }</pre>
<p>Example values are illustrative, not real findings.</p>
</section>

<section id="database">
<h2>Database design</h2>
<div class="tbl"><table>
<tr><th>Table</th><th>Responsibility</th></tr>
<tr><td><code>workspaces</code></td><td>Owners, tenants, settings</td></tr>
<tr><td><code>channels</code></td><td>Channel identities and metadata</td></tr>
<tr><td><code>brains</code></td><td>Identity, ownership, type, lifecycle status</td></tr>
<tr><td><code>brain_versions</code></td><td>Version history and artifact references</td></tr>
<tr><td><code>channel_brain_bindings</code></td><td>Channel-to-Brain relationships</td></tr>
<tr><td><code>brain_groups</code>, <code>brain_group_members</code></td><td>Parallel execution groups and roles</td></tr>
<tr><td><code>video_observations</code></td><td>Video features and performance measurements</td></tr>
<tr><td><code>comment_signals</code></td><td>Classified, privacy-aware audience feedback</td></tr>
<tr><td><code>topic_clusters</code></td><td>Grouped requests and demand estimates</td></tr>
<tr><td><code>decision_logs</code></td><td>Recommendations, evidence, versions, chosen actions</td></tr>
<tr><td><code>experiments</code></td><td>Experiment definitions and outcomes</td></tr>
<tr><td><code>model_registry</code></td><td>Model versions and evaluation metadata</td></tr>
<tr><td><code>brain_executions</code></td><td>Execution requests, statuses, results</td></tr>
<tr><td><code>brain_exports</code></td><td>Export jobs, manifests, checksums</td></tr>
<tr><td><code>audit_events</code></td><td>Lifecycle and security events</td></tr>
</table></div>
<ul>
<li>Foreign keys for integrity; indexes on workspace and channel access paths.</li>
<li>Unique constraints on version numbers within a Brain.</li>
<li>Idempotency keys for retried ingestion and lifecycle requests.</li>
<li>Large artifacts live outside PostgreSQL.</li>
<li>Transactions for attachment changes and active-version switches.</li>
<li>Complete migrations before production workflows.</li>
</ul>
</section>

<section id="api">
<h2>API</h2>
<p>Versioned under <code>/v1</code>. Every endpoint needs a documented schema, authorization checks, structured errors, request tracing and rate limits. Long tasks return a job ID.</p>
<div class="tbl"><table>
<tr><th>Group</th><th>Endpoints</th></tr>
<tr><td>Registry</td><td><code>POST /v1/brains</code> · <code>GET /v1/brains</code> · <code>GET /v1/brains/{brain_id}</code> · <code>GET /v1/brains/{brain_id}/versions</code> · <code>POST /v1/brains/{brain_id}/clone</code> · <code>POST /v1/brains/{brain_id}/export</code></td></tr>
<tr><td>Import and jobs</td><td><code>POST /v1/brains/import</code> · <code>GET /v1/brain-jobs/{job_id}</code></td></tr>
<tr><td>Bindings</td><td><code>GET /v1/channels/{channel_id}/brains</code> · <code>POST /v1/attachments</code> · <code>POST /v1/attachments/{attachment_id}/detach</code> · <code>/replace</code> · <code>/disable</code></td></tr>
<tr><td>Search and learning</td><td><code>POST /v1/channels/{channel_id}/brain/search</code> · <code>POST /v1/ideas/rank</code> · <code>POST /v1/observations</code> · <code>POST /v1/comment-signals</code> · <code>GET /v1/health</code></td></tr>
</table></div>
</section>

<section id="integration">
<h2>AI CarryON integration</h2>
<p>The ai-carryon scheduler calls the Brain platform at defined decision points.</p>
<div class="fl"><span>Trend discovery</span><i>→</i><span><b>Rank topics</b></span><i>→</i><span>Research and plan</span><i>→</i><span><b>Get learned preferences</b></span><i>→</i><span>Script, thumbnail, voice, video</span><i>→</i><span>Review and publish</span><i>→</i><span><b>Record video ID and features</b></span><i>→</i><span><b>Ingest analytics and comments</b></span></div>
<ul>
<li><b>Before topic selection:</b> the Planner sends candidates and channel context. The Coordinator returns ranked topics, evidence, confidence and Brain versions.</li>
<li><b>Before script generation:</b> hooks, structures, duration ranges, topic patterns, demand and known uncertainties. These guide generation and are not rigid rules.</li>
<li><b>After publishing:</b> record the video ID and content features, then add metrics as they arrive.</li>
<li><b>After comments:</b> extract topic requests and update demand asynchronously.</li>
</ul>
<div class="note">If Brain services are down, AI CarryON follows a configured fallback policy and logs whether a recommendation came from a Brain, a partial Brain result or the baseline Planner.</div>
</section>

<section id="portability">
<h2>Export and import</h2>
<pre>brain-package/
├── manifest.json
├── channel-profile.json
├── learned-strategy.json
├── topic-demand-snapshot.json
├── decision-policy.json
├── model-registry.json
├── evaluation-report.json
├── provenance.json
└── model-artifacts/</pre>
<p>The manifest lists Brain ID and version, package schema version, type and capabilities, runtime and framework requirements, artifact locations, sizes and checksums, training-data snapshot references, evaluation results, restoration instructions and known limitations.</p>
<h3>Import workflow</h3>
<div class="fl"><span>Upload</span><i>→</i><span>Validate manifest</span><i>→</i><span>Verify checksums</span><i>→</i><span>Check compatibility</span><i>→</i><span>Scan files</span><i>→</i><span>Dry-run report</span><i>→</i><span>Create or select Brain</span><i>→</i><span>Restore permitted state</span><i>→</i><span>Health checks</span><i>→</i><span>Stay inactive</span></div>
<div class="note ok">Exports never contain API keys, OAuth tokens or other secrets. An imported Brain stays inactive until the user activates or attaches it. Portability does not guarantee identical results on a different audience.</div>
</section>

<section id="security">
<h2>Security, privacy and reliability</h2>
<div class="g">
<div class="c"><h3>Access</h3><p>Authenticate every request. Authorize by workspace and channel. Knowing an ID grants nothing.</p></div>
<div class="c"><h3>Data</h3><p>Row-level security, metadata-filtered vector search, protected secrets, privacy-aware comment retention, backups and tested recovery.</p></div>
<div class="c"><h3>Sharing</h3><p>Explicit authorization for Brain sharing and learning transfer. Validate imported packages.</p></div>
<div class="c"><h3>Operations</h3><p>Rate limits, quotas, audit logs, dependency checks before deletion.</p></div>
</div>
<p><b>Observe:</b> API latency and errors, Brain success and timeout rates, search latency and relevance, ingestion delays and duplicates, training outcomes, candidate-versus-active quality, import/export failures, unauthorized attempts, storage and inference cost. Use structured logs, correlation IDs, bounded retries and dead-letter queues. Candidate models stay separate from active ones until they pass evaluation.</p>
</section>

<section id="roadmap"><h2>Implementation roadmap</h2><p>See the Roadmap tab for the current 12-step order.</p></section>

<section id="acceptance">
<h2>Acceptance criteria</h2>
<p>Production-ready only when all of these are demonstrated:</p>
<ul>
<li>Users can search accessible Brains by ID, metadata and learned knowledge.</li>
<li>Cross-workspace and cross-channel queries are rejected.</li>
<li>A detached Brain keeps its state and can be reattached.</li>
<li>Replacement preserves the old version history.</li>
<li>A shared Brain detaches from one channel without breaking others.</li>
<li>Several Brains run in parallel with traceable outputs.</li>
<li>Every recommendation records Brain and policy versions.</li>
<li>Duplicate ingestion events do not inflate counts.</li>

 cards=a=>`<div class="g">${a.map(x=>`<div class="c"><h3>${x[0]}</h3>${Array.isArray(x[1])?`<ul>${x[1].map(y=>`<li>${y}</li>`).join("")}</ul>`:`<p>${x[1]}</p>`}</div>`).join("")}</div>`,
 tbl=(h,r)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${r.map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join("")}</tr>`).join("")}</table>`;
const T=[bird,
()=>`<h2>Content production pipeline</h2><p>The existing ai-carryon pipeline keeps orchestrating production. It calls the Brain platform at three points and sends results back after publishing.</p>`+fl(["Trend discovery","<b>Rank topics (Coordinator, Brain Runtime)</b>","Research and plan","<b>Fetch learned guidance</b>","Script","Voice","Thumbnail","Video","Review","Publish and schedule","<b>Record video ID and features</b>","<b>Analytics and comments ingested</b>"])+cards([["Before topic selection","Planner sends candidates and channel context. Gets ranked topics, evidence, confidence and the Brain versions used."],["Before script generation","Hook types, structures, duration ranges, demand and known uncertainties. Guidance, not rigid rules."],["After publishing and comments","Video features are recorded, metrics and comment signals arrive asynchronously and update learning."],["If Brains are unavailable","Configured fallback to the baseline Planner. Every recommendation records whether it came from a Brain, a partial result or the baseline."]]),
()=>`<h2>Brain registry and lifecycle</h2><div class="note">A Brain is an independent, versioned asset. A channel attachment is a separate relationship. The Registry is the catalogue, not the Brain itself.</div><div class="g"><div class="c"><h3>Brain (registry record) <span class="b bP">Proposed</span></h3><ul><li>Brain ID, name, type</li><li>Owner and workspace</li><li>Version, capabilities, status</li><li>Created and updated timestamps</li><li>Artifact references, evaluation status</li></ul></div><div class="c"><h3>Attachment (channel relationship) <span class="b bP">Proposed</span></h3><ul><li>Attachment ID, Brain ID, channel ID</li><li>Role: primary, supporting, experimental, shadow</li><li>Enabled status, configuration</li><li>Attached version or version policy</li><li>Created and updated timestamps</li></ul></div></div>`+tbl(["Operation","What happens","Learned knowledge"],[["Create / Version","New Brain identity or new immutable version","Kept"],["Attach","Permission and compatibility checks, then activate after validation","Kept"],["Detach","Stop new work, finish or cancel in-flight jobs, mark detached","Kept, still searchable"],["Disable","Temporarily blocks execution","Kept"],["Replace","Validate, optional shadow run, atomic switch, rollback path","Old version kept"],["Clone","New identity from a snapshot. The user explicitly chooses what state is copied. Credentials and private comments are never inherited","Copied selectively"],["Archive","Out of normal selection, retained per policy","Retained"],["Import / Export","Validated, checksummed packages. Import stays inactive until activated","Restored as permitted"],["Delete","Separate step: checks active attachments, dependent Brains, running jobs, retention rules and authorization, then asks for confirmation","Removed"]])+`<h3>Sharing and data isolation</h3>${cards(ISO)}<h3>Brain package <span class="b bP">Proposed</span></h3><p><code>manifest.json</code> <code>channel-profile.json</code> <code>learned-strategy.json</code> <code>topic-demand-snapshot.json</code> <code>decision-policy.json</code> <code>model-registry.json</code> <code>evaluation-report.json</code> <code>provenance.json</code> <code>model-artifacts/</code></p><p>The manifest carries schema versions, checksums, compatible runtimes, artifact metadata and restoration instructions. Exports never contain secrets, OAuth tokens or unauthorized raw comments.</p><h3>Search</h3><p>Structured filters (ID, name, owner, channel, type, status, version, dates) and semantic search (topics, requests, strategies, observations). Authorization is enforced first. Similarity is never authorization.</p>`,
()=>`<h2>Parallel Brain execution</h2>${tbl(["Component","Responsibility"],RESP)}<p>Example: ranking topics for a cricket video.</p>`+fl(["ai-carryon requests ranking","Coordinator resolves authorized attachments and immutable versions","Brain Runtime executes Cricket Performance, Cricket Demand and other Brains on the same candidates","Each Brain evaluates independently","Standard responses return","Aggregator applies versioned policy","Ranked result returns to ai-carryon"])+cards([["Controls",["Concurrency limit per execution","Timeout per Brain","Partial results accepted","Failures isolated per Brain"]],["Fallback",["Deterministic fallback policy","Baseline Planner if too few Brains answer","Source of every recommendation logged"]],["Standard response",["execution_id, brain_id, brain_version_id","status, recommendations, confidence","evidence_refs, reason_codes, created_at"]],["Safety",["Confidence is not assumed comparable across models","Hard constraints stay outside ranking scores","Models never override safety, permissions or publishing rules"]]]),
()=>`<h2>Learning and feedback loop</h2>`+fl(["YouTube data","Evidence ingestion","Queue and workers","Validation and deduplication","Comment classification","Topic extraction and clustering","Demand estimation and performance prediction","Reward and decision policy","Experiment tracking","Training and evaluation","Model registry and object storage","Approved version to Brain Runtime","Future recommendations"])+cards([["Experiment tracking",["Experiment ID and configuration","Candidates, recommendation shown, action actually taken","Brain and policy versions, observation window","Outcomes, reward, sample size, evaluation"]],["Data-quality checks",["Missing analytics","Duplicate observations","Sample size","Video age and channel baselines"]],["Background jobs",["Analytics polling, comment ingestion","Embeddings, cluster maintenance","Training and evaluation","Import/export, artifact validation","Idempotency keys, bounded retries, dead letters, job status records"]],["Demand estimator considers",["Unique requesters","Frequency of similar requests","Recency and momentum","Channel history, exposure and size","Spam and duplicate signals","Confidence and sample size"]],["Performance signals",["Views relative to channel baseline","Retention or watch time","Engagement and shares","Subscriber conversion where available"]],["Update cadence",["Comment classification: inference per comment","Demand, clusters, bandit: incremental","Supervised models: periodic retraining","Promotion only after evaluation"]],["Honest limits",["Reward config is versioned and set per channel","Predictions show confidence","Correlation is not causation","One request never triggers a video"]]]),
()=>`<h2>Data and storage</h2>`+tbl(["Store","Holds","Status"],[["PostgreSQL","Users, workspaces, channels, Brains, versions, attachments, observations, decisions, experiments, audit logs, metadata","Proposed"],["Vector search","Embeddings of knowledge, comments, topics, learned patterns (pgvector or compatible)","Proposed"],["Object storage","Model artifacts, Brain snapshots, exports, evaluation reports","Proposed"],["Redis / job queue","Caching and async work: ingestion, embeddings, training, imports, exports, artifact validation. Job status stored in PostgreSQL","Optional"],["Secret Manager","API credentials and OAuth tokens","Proposed"],["YouTube APIs","Analytics, comments, publishing (subject to permissions)","External"],["GitHub","Source code, tests, migrations, configuration templates only","Not a database, not a secret store"]])+`<p>brain_versions rows are immutable. Activation is transactional. Foreign keys, unique constraints and idempotency keys protect integrity. Large artifacts live in object storage with references, metadata and checksums in PostgreSQL.</p>`,
()=>`<h2>API overview</h2><div class="note">Proposed contracts. None of these endpoints are claimed to exist yet. Health uses <code>/v1/health</code> (liveness) and <code>/v1/ready</code> (readiness).</div><div class="g">`+[["Brains",["POST /v1/brains","GET /v1/brains","GET /v1/brains/{brain_id}","GET /v1/brains/{brain_id}/versions","POST /v1/brains/{brain_id}/clone","POST /v1/brains/{brain_id}/export","POST /v1/brains/import"]],["Attachments",["POST /v1/attachments","POST /v1/attachments/{attachment_id}/detach","POST /v1/attachments/{attachment_id}/replace","POST /v1/attachments/{attachment_id}/disable","GET /v1/channels/{channel_id}/brains"]],["Search and decisions",["POST /v1/channels/{channel_id}/brain/search","POST /v1/ideas/rank","GET /v1/decisions","GET /v1/decisions/{decision_id}"]],["Learning and experiments",["POST /v1/observations","POST /v1/comment-signals","POST /v1/experiments","GET /v1/experiments/{experiment_id}"]],["Models",["POST /v1/models/{model_version_id}/promote","POST /v1/models/{model_version_id}/rollback"]],["Jobs and health",["GET /v1/jobs/{job_id}","GET /v1/health","GET /v1/ready"]]].map(x=>`<div class="c"><h3>${x[0]}</h3><ul>${x[1].map(y=>`<li><code>${y}</code></li>`).join("")}</ul></div>`).join("")+`</div><p>Long-running work returns a job ID and is polled at <code>GET /v1/jobs/{job_id}</code>. Mutating requests accept an <code>Idempotency-Key</code> header. Every endpoint needs a schema, authorization, structured errors, tracing and rate limits.</p>`,
()=>`<h2>Security and isolation</h2>`+cards([["Channel isolation","Observations, rewards, demand and decisions are scoped to a workspace and channel. Sharing a model never shares private audience history."],["Access control","Every request authenticated and authorized. Knowing a Brain or channel ID grants nothing."],["Search","Permissions filter before retrieval. Vector similarity is not authorization."],["Secrets","In the Secret Manager only. Never in GitHub, exports or logs."],["Imports and exports","Checksums, manifest validation, file scanning, dry run. Imported Brains stay inactive."],["Auditing","Lifecycle and access events logged. Deletes check active attachments, dependencies, running jobs, retention and authorization. Logs exclude secrets and unnecessary raw personal data."]]),
()=>`<h2>Deployment and observability</h2>`+tbl(["Layer","Technology","Status"],[["Orchestration","GitHub Actions + Python schedulers","Existing"],["Platform API","Express.js / Node.js","Proposed"],["Learning engine and Brain Runtime","Python / FastAPI (Runtime starts inside this service)","Proposed"],["Workers","Same codebase as the engine, separate process","Proposed"],["Database","PostgreSQL","Proposed"],["Semantic retrieval","pgvector or compatible vector database","Proposed"],["Job queue","Redis-backed queue or equivalent","Optional"],["Artifacts","Object storage","Proposed"],["Secrets","Secret Manager","Proposed"],["External","YouTube Data and Analytics APIs, subject to permissions","External"]])+`<div class="note">Start with three deployables: the Express API, the FastAPI service (engine plus Runtime) and a worker process. Keep modules separate in code. No Kafka, Kubernetes or extra databases without a measured need.</div><h3>Observability</h3>`+cards([["Metrics",["API latency and error rates","Per-Brain latency and timeouts","Partial-result and fallback rates","Queue backlog and processing delay"]],["Quality and cost",["Ingestion duplicates and failures","Model drift and evaluation results","Import/export failures","Inference and storage cost","Unauthorized requests"]],["Tracing and logs",["Correlation IDs across the ai-carryon pipeline, Coordinator, Runtime and learning jobs","Structured logs free of secrets and unnecessary raw personal data","Audit events for lifecycle and access"]]]),
()=>`<h2>Implementation roadmap</h2><ol class="rm">`+["Fix and validate this architecture visualization","Define workspace and channel boundaries, identifiers, schemas and API contracts","Implement the Brain Registry, versioning and structured search","Implement lifecycle operations and audit logging","Implement the Brain Runtime with one simple working Brain","Integrate the Runtime and Coordinator with the existing ai-carryon pipeline","Implement concurrency, timeouts, partial results and fallback behavior","Implement asynchronous analytics and comment ingestion with data-quality checks","Implement demand estimation, decision logging and initial ranking","Add experiments, contextual bandits and supervised prediction when enough data exists","Implement validated import/export, artifact checksums and rollback","Add observability, security hardening, backups and recovery tests"].map(x=>`<li>${x}</li>`).join("")+`</ol><p>Keep logical modules separate in code but deploy few services.</p>`,
()=>`<div class="note">Reference text from the original architecture document. Where it differs from tabs 1-10 (for example the roadmap), the tabs are current.</div><div id="ref">${$("refT").innerHTML}</div>`];

const tbEl=document.getElementById("tabs"),m=document.getElementById("m");
TABS.forEach((t,i)=>{const b=document.createElement("button");b.textContent=t;b.id="tab-"+i;b.setAttribute("role","tab");b.setAttribute("aria-controls","panel");b.setAttribute("aria-selected","false");b.tabIndex=-1;b.onclick=()=>go(i);b.addEventListener("keydown",e=>{let j=i;if(e.key==="ArrowRight")j=(i+1)%TABS.length;else if(e.key==="ArrowLeft")j=(i-1+TABS.length)%TABS.length;else if(e.key==="Home")j=0;else if(e.key==="End")j=TABS.length-1;else return;e.preventDefault();go(j);tbEl.children[j].focus()});tbEl.appendChild(b)});
m.setAttribute("role","tabpanel");m.id="panel";m.setAttribute("aria-label","Architecture section");
function go(i){[...tbEl.children].forEach((b,j)=>{b.classList.toggle("on",i===j);b.setAttribute("aria-selected",String(i===j));b.tabIndex=i===j?0:-1});m.setAttribute("aria-labelledby","tab-"+i);m.innerHTML=T[i]();if(i===0)mountBird();try{history.replaceState(null,"","#"+i)}catch(_){}}
go(Math.min(TABS.length-1,Math.max(0,parseInt(location.hash.slice(1))||0)));
</script></body></html>
